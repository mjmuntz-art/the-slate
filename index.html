<style>
:root {
  --floor: #EDEFF2;
  --sheet: #FFFFFF;
  --ink: #12161C;
  --ink-2: #535C69;
  --ink-3: #8A929D;
  --rule: #D8DDE3;
  --rule-2: #EEF1F4;
  --algo: #2344A8;
  --algo-soft: #E3E9F9;
  --player: #D9601C;
  --player-soft: #FCE9DD;
  --win: #1E7B4F;
  --out: #B4322A;
  --q: #9A6410;
  --display: "Big Shoulders Display", "Arial Narrow", sans-serif;
  --text: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 12px; }
body { margin: 0; background: var(--floor); color: var(--ink); font: 400 15px/1.5 var(--text); font-variant-numeric: tabular-nums; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--algo); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
@media (max-width: 600px) {
  .wrap { padding: 0 16px; } }

/* masthead */
.mast { background: var(--ink); color: #fff; }
.mast .wrap { padding-top: 20px; padding-bottom: 14px; }
.mast .mt { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.mast h1 { margin: 0; font: 800 clamp(40px, 7vw, 62px)/0.86 var(--display); letter-spacing: -0.01em; }
.mast .date { margin: 8px 0 0; font-size: 14.5px; color: #C9CFD8; }
.mast .date strong { color: #fff; font-weight: 600; }
.refresh { display: inline-block; text-decoration: none; background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 5px 14px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.build { margin: 18px 0 0; font-size: 11px; color: #8a8f99; }
.refresh[hidden] { display: none; }
.refresh:hover { background: rgba(255,255,255,.2); }
.dot.v { background: var(--ink); }

/* tab bar: under the masthead on a computer, pinned to the bottom on a phone */
.tabbar { position: sticky; top: 0; z-index: 6; background: var(--ink); border-top: 1px solid rgba(255,255,255,.08); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
.tabbar .wrap { display: flex; gap: 2px; }
.tabbar button { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; border-bottom: 3px solid transparent; color: #AEB5BF; font-weight: 600; font-size: 14px; padding: 11px 14px 9px; cursor: pointer; }
.tabbar button:hover { color: #fff; }
.tabbar button.on { color: #fff; border-bottom-color: #fff; }
.tabbar svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 760px) {
  body { padding-bottom: 76px; }
  .tabbar { position: fixed; top: auto; bottom: 0; left: 0; right: 0; border-top: 1px solid rgba(255,255,255,.1); }
  .tabbar .wrap { display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); gap: 4px; }
  .tabbar button { flex-direction: column; gap: 3px; border: 0; border-radius: 10px; padding: 7px 0 6px; font-size: 11.5px; }
  .tabbar button.on { background: rgba(255,255,255,.1); }
  .tabbar svg { width: 22px; height: 22px; }
}

/* record screen */
.figs { display: flex; flex-wrap: wrap; gap: 14px; margin: 14px 0 6px; }
.fig { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
.fig b { font: 700 32px/1 var(--display); }
.fig span { color: var(--ink-2); font-size: 13px; }
.trust { display: flex; gap: 10px; align-items: baseline; padding: 10px 14px; border-radius: 10px; background: #FFF6E5; border: 1px solid #F3D9A6; font-size: 13.5px; color: #5C4310; margin: 0 0 6px; }
.trust b { font: 700 15px/1.2 var(--display); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; color: #8A5A00; }
.h2b { margin-top: 34px; }
.howto { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 12px; }
.howto > div { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; }
.howto h3 { margin: 0 0 6px; font: 700 18px/1.1 var(--display); }
.howto p { margin: 0; color: var(--ink-2); font-size: 14px; }
.howto b { color: var(--ink); }
@media (max-width: 640px) { .howto { grid-template-columns: 1fr; } .trust { flex-direction: column; gap: 2px; } }

/* sections */
section { padding: 34px 0 8px; }
h2 { font: 700 30px/1 var(--display); margin: 0 0 4px; letter-spacing: 0.005em; }
.sub { color: var(--ink-2); margin: 0 0 18px; max-width: 72ch; }

/* faces, logos, player links */
.logo { width: 34px; height: 34px; object-fit: contain; }
.logo-fallback { width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font: 700 12px/1 var(--text); flex: none; }
.face { position: relative; width: 38px; height: 38px; border-radius: 50%; overflow: hidden; background: #fff; box-shadow: inset 0 0 0 2px var(--tc, #ccc); flex: none; display: inline-block; vertical-align: middle; }
.face .player-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 12%; z-index: 1; }
.face .tl { position: absolute; inset: 16%; width: 68%; height: 68%; object-fit: contain; }
.face .ini { display: none; position: absolute; inset: 0; place-items: center; font: 700 11px/1 var(--text); color: #fff; background: var(--tc, #555); }
.face.nologo .ini { display: grid; }
.face.sm { width: 28px; height: 28px; }
.face.sm .ini { font-size: 9px; }
.pl { background: none; border: 0; padding: 0; margin: 0; font-weight: 600; cursor: pointer; text-align: left; color: var(--ink); }
.pl:hover { text-decoration: underline; text-underline-offset: 3px; }

/* best spots */
.spots { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.spot { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.band { height: 6px; }
.spot .body { padding: 16px 18px 14px; display: grid; gap: 12px; flex: 1; }
.spot .who { display: flex; align-items: center; gap: 12px; }
.spot .who .logo, .spot .who .logo-fallback { width: 52px; height: 52px; }
.spot .bet { font: 800 40px/0.9 var(--display); }
.spot .ctx { color: var(--ink-2); font-size: 13px; }
.spot .tag { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.spot .tag.both { color: var(--ink); }
.swipe { display: none; }
@media (max-width: 760px) { .swipe { display: inline; } }
.probs { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-2); align-items: baseline; }
.probs .lbl { flex-basis: 100%; font-size: 12px; color: var(--ink-3); margin-bottom: -2px; }
.probs b { color: var(--ink); font: 700 20px/1 var(--display); margin-right: 3px; }
.prices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.price { border-radius: 10px; padding: 8px 10px; background: var(--rule-2); }
.price.go { background: var(--ink); color: #fff; }
.price small { display: block; font-size: 11.5px; opacity: .78; }
.price b { font: 700 22px/1.1 var(--display); }
.spot .foot { border-top: 1px solid var(--rule-2); padding: 9px 18px; font-size: 12.5px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 10px; }
.res { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px; font: 700 13px/1 var(--text); color: #fff; }
.res.W { background: var(--win); } .res.L { background: var(--out); } .res.P { background: var(--ink-3); }

@media (max-width: 760px) {
  .spots { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; margin: 0 -16px; padding: 0 16px 6px; scrollbar-width: none; }
  .spots::-webkit-scrollbar { display: none; }
  .spot { flex: 0 0 86%; scroll-snap-align: start; }
}

/* game banner */
/* game header (option D) */
.bn-top { position: relative; display: grid; grid-template-columns: 1fr 1fr; min-height: 150px; color: #fff; isolation: isolate; background: var(--ink); }
.bn-half { position: relative; overflow: hidden; display: flex; align-items: center; gap: 18px; padding: 0 30px; background: var(--tc); min-width: 0; isolation: isolate; }
.bn-half::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.24)); z-index: -1; }
.bn-half.away { clip-path: polygon(0 0, 100% 0, calc(100% - 34px) 100%, 0 100%); margin-right: -17px; padding-right: 124px; }
.bn-half.home { clip-path: polygon(34px 0, 100% 0, 100% 100%, 0 100%); margin-left: -17px; flex-direction: row-reverse; text-align: right; padding-left: 124px; }
.bn-wm { position: absolute; width: 250px; height: 250px; top: -50px; z-index: -1; opacity: .2; pointer-events: none; }
.bn-half.away .bn-wm { left: -70px; transform: rotate(-10deg); } .bn-half.home .bn-wm { right: -70px; transform: rotate(10deg); }
.bn-wm img { width: 100%; height: 100%; object-fit: contain; display: block; }
.bn-logo img { width: 100%; height: 100%; object-fit: contain; display: block;
  filter: drop-shadow(0 0 1px rgba(255,255,255,.85)) drop-shadow(0 0 1px rgba(255,255,255,.85)) drop-shadow(0 3px 8px rgba(0,0,0,.35)); }
.bn-logo { width: 80px; height: 80px; flex: none; display: grid; place-items: center; }
.bn-logo b { font: 800 22px/1 var(--display); }
.bn-name { display: flex; flex-direction: column; min-width: 0; }
.bn-name b { font: 800 46px/.85 var(--display); }
.bn-name small { font-size: 13px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bn-name small.rest { opacity: 1; font-weight: 600; }
.bn-score { margin-left: auto; text-align: right; font: 800 64px/.85 var(--display); }
.bn-half.home .bn-score { margin-left: 0; margin-right: auto; text-align: left; }
.bn-score small { display: block; font: 600 10.5px/1 var(--text); opacity: .8; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
.bn-score.lost { opacity: .6; }
.bn-pill { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--ink); color: #fff; border-radius: 14px; padding: 10px 18px; text-align: center; min-width: 120px; box-shadow: 0 6px 18px rgba(0,0,0,.28); z-index: 2; }
.bn-pill b { display: block; font: 800 22px/1 var(--display); text-transform: uppercase; }
.bn-pill span { display: block; font-size: 12px; color: #C9CFD8; margin-top: 4px; white-space: nowrap; }
.bn-tape { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--rule); background: var(--sheet); }
.bn-chips { display: flex; gap: 8px; }
.bn-chip { display: flex; gap: 8px; align-items: baseline; border: 1px solid var(--rule); border-radius: 10px; padding: 7px 11px; font-size: 13px; white-space: nowrap; }
.bn-chip em { font-style: normal; color: var(--ink-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
.bn-chip .m { color: var(--algo); }
.bn-win { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.bn-wt { display: flex; justify-content: space-between; gap: 8px; font: 700 13px/1 var(--text); white-space: nowrap; } .bn-wt span:nth-child(2) { color: var(--ink-3); font-weight: 500; }
.bn-wp { display: flex; height: 9px; border-radius: 99px; overflow: hidden; background: var(--rule-2); } .bn-wp i { display: block; }
.bn-right { display: flex; justify-content: flex-end; }
.bn-lock { display: inline-flex; align-items: center; gap: 6px; font: 700 11px/1 var(--text); text-transform: uppercase; letter-spacing: .05em; color: #8A5A00; background: #FFF2D6; border: 0; border-radius: 999px; padding: 7px 11px; white-space: nowrap; cursor: default; }
button.bn-lock { cursor: pointer; } button.bn-lock:hover { background: #FBE6B8; }
.bn-lock::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #C98A12; }
.bn-lock.fin { color: #fff; background: var(--ink); } .bn-lock.fin::before { background: #fff; }
.bn-lock.open { color: var(--ink-2); background: var(--rule-2); } .bn-lock.open::before { background: var(--ink-3); }
.bn-note { margin: 0; padding: 9px 20px; background: #FFF6E5; border-bottom: 1px solid var(--rule); font-size: 13px; color: var(--ink-2); }
@media (max-width: 760px) {
  .bn-top { min-height: 0; }
  .bn-half { flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px 40px 14px 14px; }
  .bn-half.away { padding-right: 40px; } .bn-half.home { flex-direction: column; align-items: flex-end; padding: 14px 14px 14px 40px; }
  .bn-logo { width: 44px; height: 44px; } .bn-name b { font-size: 30px; } .bn-name small:not(.rest) { display: none; }
  .bn-score { margin: 0; font-size: 40px; } .bn-half.home .bn-score { margin: 0; }
  .bn-wm { width: 170px; height: 170px; }
  .bn-pill { position: static; transform: none; grid-column: 1 / 3; border-radius: 0; display: flex; gap: 12px; justify-content: center; align-items: baseline; box-shadow: none; padding: 8px; }
  .bn-pill b { font-size: 18px; } .bn-pill span { margin: 0; }
  .bn-tape { grid-template-columns: 1fr; gap: 10px; padding: 12px; }
  .bn-chips { flex-wrap: wrap; } .bn-right { justify-content: flex-start; }
  .bn-note { padding: 9px 12px; }
}
.bottomline { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--rule); }
.bl { padding: 10px 18px; font-weight: 700; font-size: 15px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.bl + .bl { border-left: 1px solid var(--rule-2); }
.bl em { flex-basis: 100%; font-style: normal; font-weight: 500; font-size: 11.5px; color: var(--ink-3); }
.bl small { font-weight: 500; font-size: 12px; color: var(--ink-2); }
.bl.bet { background: #F2F4F7; }
.bl .res { margin-left: auto; align-self: center; }
.bl.bet em::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--win); margin-right: 6px; vertical-align: 1px; }
.bl.lean { color: var(--ink); font-weight: 600; }
.bl.pass { color: var(--ink-3); font-weight: 500; }
@media (max-width: 640px) { .bottomline { grid-template-columns: 1fr; } .bl + .bl { border-left: 0; border-top: 1px solid var(--rule-2); } .bl em { flex-basis: auto; min-width: 74px; } }
.context { display: flex; flex-wrap: wrap; gap: 6px 8px; padding: 10px 18px; border-bottom: 1px solid var(--rule-2); }
.chip-c { font-size: 12.5px; color: var(--ink-2); background: var(--rule-2); border-radius: 999px; padding: 3px 10px; }
.chip-c b { color: var(--ink); font-weight: 600; }
.chip-c.out { background: #FBEAE8; } .chip-c.out b { color: var(--out); }
.chip-c.q { background: #FBF1DF; } .chip-c.q b { color: var(--q); }
/* game */
.game { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; margin-bottom: 18px; overflow: hidden; }
.game-top { display: grid; grid-template-columns: minmax(270px, 350px) 1fr; }
@media (max-width: 860px) { .game-top { grid-template-columns: 1fr; } }
.matchup { padding: 18px 20px; border-right: 1px solid var(--rule-2); }
@media (max-width: 860px) { .matchup { border-right: 0; border-bottom: 1px solid var(--rule-2); } }
.teams { display: flex; align-items: center; gap: 10px; }
.team { display: flex; align-items: center; gap: 8px; }
.team .code { font: 800 34px/1 var(--display); }
.at { color: var(--ink-3); font-size: 14px; }
.tip { margin: 6px 0 14px; color: var(--ink-2); font-size: 13px; }
.tip .flag { color: var(--out); font-weight: 600; }
.final { display: inline-flex; gap: 8px; align-items: baseline; font-weight: 600; color: var(--ink); }
.score { width: 100%; border-collapse: collapse; font-size: 14px; }
.score th { text-align: right; font-weight: 500; color: var(--ink-3); font-size: 12px; padding: 0 6px 4px; }
.score th:first-child { text-align: left; padding-left: 6px; }
.score td { padding: 6px; text-align: right; border-top: 1px solid var(--rule-2); }
.score td:first-child { text-align: left; color: var(--ink-2); }
.score td.n { font: 700 20px/1 var(--display); }
.score tr.far.a td { background: var(--algo-soft); }
.score tr.far.p td { background: var(--player-soft); }
.score .gap { display: block; font: 500 11px/1.2 var(--text); color: var(--ink-2); margin-top: 2px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
.dot.a { background: var(--algo); } .dot.p { background: var(--player); } .dot.v { background: var(--ink); border-radius: 1px; width: 3px; height: 11px; vertical-align: -1px; margin: 0 9px 0 2px; }

.lines { padding: 16px 20px 18px; display: grid; gap: 18px; }
.strip-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
.strip-head h3 { margin: 0; font: 700 19px/1 var(--display); letter-spacing: 0.01em; }
.verdict { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.verdict.both { background: var(--ink); color: #fff; }
.verdict.lean { border: 1px solid var(--ink-2); color: var(--ink); }
.verdict.split, .verdict.quiet { color: var(--ink-3); padding-left: 0; padding-right: 0; font-weight: 500; white-space: normal; }
.verdict .res { height: 18px; min-width: 18px; font-size: 11px; }
.strip { position: relative; }
.strip svg { display: block; overflow: visible; }
.strip text { font-family: var(--text); font-size: 12px; fill: var(--ink-2); }
.strip .val { font-weight: 600; fill: var(--ink); font-size: 13px; }
.strip text.end { fill: var(--ink-3); font-size: 11.5px; }
.prices.ghost { position: relative; }
.prices.ghost .price { background: transparent; border: 1px dashed var(--rule); color: var(--ink-2); }
.prices.ghost .price b { color: var(--ink-2); }
.prices.ghost .trk { grid-column: 1 / -1; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
.bottomline.more-lines { grid-template-columns: repeat(4, 1fr); background: #FAFBFC; }
.bottomline.more-lines .bl { font-size: 13.5px; padding: 8px 18px; }
@media (max-width: 640px) { .bottomline.more-lines { grid-template-columns: 1fr; } .bottomline.more-lines .bl em { min-width: 104px; } }
.bl.bet.trk em::before { background: #C99A2E; }
table.mini { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 4px; }
table.mini th { font-size: 11.5px; font-weight: 600; color: var(--ink-3); text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.mini th:first-child, table.mini td:first-child { text-align: left; }
table.mini td { padding: 5px 6px; border-bottom: 1px solid var(--rule-2); color: var(--ink-2); }
table.mini td.n { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.guard { display: inline-block; margin-left: 4px; padding: 1px 6px; border-radius: 999px; background: #FBF1DF; color: #8A5A00; font-size: 11px; font-weight: 600; white-space: nowrap; }
.ml-line { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); }
.ml-line b { color: var(--ink); font-weight: 600; }

.more { width: 100%; text-align: left; background: var(--rule-2); border: 0; border-top: 1px solid var(--rule); padding: 11px 20px; cursor: pointer; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; }
.more:hover { background: #E4E8ED; }
.more .chev { transition: transform .2s; }
.more[aria-expanded="true"] .chev { transform: rotate(180deg); }
.detail { padding: 18px 20px 8px; border-top: 1px solid var(--rule-2); display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.detail[hidden] { display: none; }
@media (max-width: 860px) { .detail { grid-template-columns: 1fr; } }
.rot { min-width: 0; }
.rot h4 { margin: 0 0 2px; font: 700 18px/1.1 var(--display); }
.rot .meta { margin: 0 0 10px; color: var(--ink-2); font-size: 13px; }
.mins { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; background: var(--rule-2); margin-bottom: 12px; }
.mins i { min-width: 0; }
.mins i.q { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.4) 0 3px, transparent 3px 6px); }
.rows { list-style: none; margin: 0 0 14px; padding: 0; font-size: 13.5px; }
.rows li { display: grid; grid-template-columns: 30px minmax(0, 1fr) 64px 40px 62px; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--rule-2); }
.rows li .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rows .mb { height: 6px; border-radius: 3px; background: var(--rule-2); overflow: hidden; }

/* player card */
dialog.card { border: 0; border-radius: 18px; padding: 0; width: min(620px, calc(100vw - 20px)); max-height: calc(100vh - 32px); box-shadow: 0 24px 60px rgba(18, 22, 28, .3); }

/* hero: dark team-tinted backdrop, big faded team logo behind the headshot (prop cards + player card) */

.hero .wm, .card .hd .wm { position: absolute; z-index: -1; object-fit: contain; opacity: .16; filter: saturate(.55) brightness(1.15); pointer-events: none; }

.card .hd { display: flex; align-items: flex-end; min-height: 178px; padding: 24px 64px 22px 214px; }

.card h4 { margin: 0 0 8px; font: 700 18px/1 var(--display); }

.card .muted.nol { margin-top: 12px; }

.card .rhead .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

.card .outlook { position: relative; height: 58px; margin: 22px 4px 4px; }

.card .share, .card .prow { display: grid; grid-template-columns: 74px 1fr 44px 150px; gap: 10px; align-items: center; font-size: 13.5px; padding: 4px 0; }

.card .stat-tog { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 10px; }
.card .stat-tog button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 5px 11px; font: 600 12.5px/1.2 var(--text); color: var(--ink-2); cursor: pointer; }

.card .lk.fade { border-top: 0; height: 8px; width: 12px; border-radius: 2px; opacity: .42; }
.card table th.on, .card table td.on { background: var(--rule-2); color: var(--ink); font-weight: 700; }
.card .legend-c { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 8px 0 0; font-size: 12px; color: var(--ink-2); }
.card .legend-c span { display: inline-flex; align-items: center; gap: 6px; }
.card .lk { width: 18px; border-top: 2px dashed var(--ink); display: inline-block; }

.card table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.card td, .card th { padding: 5px 4px; text-align: right; border-bottom: 1px solid var(--rule-2); }
.card th { font-size: 11.5px; color: var(--ink-3); font-weight: 600; }

@media (max-width: 600px) {

}

footer { padding: 10px 0 34px; }
/* Today: one slim row per game */

.grow::before { content: ""; display: block; height: 5px; background: linear-gradient(90deg, var(--ta) 50%, var(--th) 50%); }
.grow:hover { border-color: var(--ink-3); box-shadow: 0 4px 14px rgba(18,22,28,.08); }
.gr-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 14px 16px 10px; }
.rt { display: flex; align-items: center; gap: 10px; min-width: 0; }

.rn { display: flex; flex-direction: column; }

.gr-calls { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 40px 14px 16px; border-top: 1px solid var(--rule-2); }

.grow .chev { position: absolute; right: 14px; bottom: 12px; color: var(--ink-3); font-size: 22px; line-height: 1; }
.spot[data-go] { cursor: pointer; }
.spot[data-go]:hover { border-color: var(--ink-3); }
@media (max-width: 760px) { .slate { grid-template-columns: 1fr; } }
@media (max-width: 400px) { .gr-top { padding: 12px 12px 8px; } .rt { gap: 7px; } .rt .logo, .rt .logo-fallback { width: 32px; height: 32px; } .rn b { font-size: 24px; } .gr-calls { padding-left: 12px; } }

/* game Overview */

.gt { flex: 0 0 178px; scroll-snap-align: start; display: grid; gap: 4px; text-align: left; background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 9px 11px; cursor: pointer; font: inherit; color: var(--ink); }
.gt:hover { border-color: var(--ink-3); }
.gt-st { font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.gt-st.live { color: var(--out); } .gt-st.live::before { content: "● "; }
.gt-st.fin { color: var(--ink); }
.gt-t { display: flex; align-items: center; gap: 7px; }
.gt-t .logo, .gt-t .logo-fallback { width: 20px; height: 20px; }
.gt-t b { font: 700 16px/1 var(--display); }
.gt-t em { margin-left: auto; font: 700 16px/1 var(--display); font-style: normal; }
.gt-t.lost { color: var(--ink-3); }
.gt-l { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; border-top: 1px solid var(--rule-2); padding-top: 6px; margin-top: 2px; white-space: nowrap; overflow: hidden; }
.gt-l em { font-style: normal; font-weight: 500; color: var(--ink-3); }
.gt-l .res { height: 16px; min-width: 16px; font-size: 10px; margin-left: auto; }
@media (max-width: 560px) { .gt { flex-basis: 150px; } }
.gstrip + section { padding-top: 18px; }
.spot .tag .rk { display: inline-grid; place-items: center; min-width: 22px; height: 18px; margin-right: 6px; padding: 0 5px; border-radius: 5px; background: var(--ink); color: #fff; font: 700 11px/1 var(--text); }
/* Record screen */
.rtiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 12px 0 14px; }
@media (max-width: 760px) { .rtiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.rtile { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.rtile small { display: block; font-size: 12px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .03em; }
.rtile b { display: block; font: 700 34px/1.05 var(--display); margin: 4px 0 2px; }
.rtile em { font-style: normal; font-size: 12.5px; color: var(--ink-2); }
.pos { color: var(--win); } .neg { color: var(--out); }
.rcard { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; min-width: 0; }
.rcard h3 { margin: 0; font: 700 19px/1.1 var(--display); }
.rcard > p.muted { margin: 3px 0 10px; font-size: 12.5px; }
.rgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.rgrid .rcard { margin-bottom: 0; }
.rgrid + .rcard { margin-top: 14px; }
@media (max-width: 760px) { .rgrid { grid-template-columns: minmax(0, 1fr); } }
.rb { display: grid; grid-template-columns: 96px minmax(0, 1fr) 92px; gap: 10px; align-items: center; padding: 4px 0; font-size: 13px; }
.rb.thin { opacity: .55; }
.rb-l { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rb-t { position: relative; height: 12px; background: var(--rule-2); border-radius: 4px; }
.rb-t i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--ink-3); }
.rb-t i.up { background: var(--win); } .rb-t i.dn { background: var(--out); } .rb-t i.blue { background: #2F6FB3; } .rb-t i.gray { background: #A9B0B8; }
.rb-t i.a { background: var(--algo, #2F6FB3); } .rb-t i.p { background: var(--player, #E07B39); }
.rb-t s { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); text-decoration: none; }
.rb-r { text-align: right; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.rnote { margin: 8px 0 0; font-size: 12.5px; }
.rh4 { margin: 14px 0 4px; font: 700 15px/1.1 var(--display); }
table.data.rpj { min-width: 0; width: 100%; }
.uchart text, .cchart text { font: 11px var(--text); fill: var(--ink-3); }
.uchart .z, .cchart .ax { stroke: var(--rule); stroke-width: 1; }
.uchart .lg { fill: none; stroke: #2F6FB3; stroke-width: 2.5; } .uchart .lp { fill: none; stroke: #E07B39; stroke-width: 2; stroke-dasharray: 5 4; }
.uchart .dg, .ulg i.dg { fill: #2F6FB3; background: #2F6FB3; } .uchart .dp, .ulg i.dp { fill: #E07B39; background: #E07B39; }
.cchart .diag { stroke: var(--ink-3); stroke-dasharray: 4 4; }
.cchart circle.ok, .ulg i.ok { fill: #2F6FB3; background: #2F6FB3; } .cchart circle.over, .ulg i.over { fill: var(--out); background: var(--out); } .cchart circle.under, .ulg i.under { fill: var(--win); background: var(--win); }
.cchart circle { fill-opacity: .85; } .cchart circle.thin { fill-opacity: .35; }
.ulg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.ulg i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
.ln-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ln-head .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.ln-g { margin-top: 12px; }
.ln-g h4 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 4px; font: 700 16px/1.1 var(--display); }
.ln-g h4 .logo, .ln-g h4 .logo-fallback { width: 22px; height: 22px; }
.ln-g h4 .vs { font: 500 12px var(--text); color: var(--ink-3); margin: 0 4px; }
.ln-wl { margin-left: auto; font: 600 13px var(--text); color: var(--ink-2); }
table.data.ln-t { min-width: 0; width: 100%; }
.ln-wrap { overflow-x: auto; }
table.data.ln-t td:first-child { white-space: normal; }
table.data.ln-t td { white-space: nowrap; }
table.data.ln-t td small { display: block; font-size: 11px; color: var(--ink-3); }
table.data.ln-t tr.fl td:first-child b { color: var(--ink); }
.cv { font-size: 12px; } .cv.b { color: var(--win); } .cv.w { color: var(--out); } .cv.s { color: var(--ink-3); }
@media (max-width: 560px) { .rb { grid-template-columns: 78px minmax(0, 1fr) 80px; gap: 7px; } .rtile b { font-size: 28px; } table.data.ln-t td, table.data.ln-t th { padding-left: 4px; padding-right: 4px; } }
.ln-pick { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 1px 10px; }
@media (max-width: 560px) { .ln-chip { padding: 5px 10px 5px 6px; } .ln-chip .logo, .ln-chip .logo-fallback { width: 18px; height: 18px; } .ln-chip b { font-size: 14px; } }
.ln-chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px; border: 1px solid var(--rule); border-radius: 999px; background: var(--sheet); cursor: pointer; font: inherit; color: var(--ink); }
.ln-chip .logo, .ln-chip .logo-fallback { width: 20px; height: 20px; margin-right: -2px; }
.ln-chip b { font: 700 15px/1 var(--display); margin-left: 4px; }
.ln-chip span { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.ln-chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.ln-chip[aria-pressed="true"] span { color: #C9CED6; }
small.ptp { display: block; font-size: 10.5px; font-weight: 600; color: #B5651D; white-space: nowrap; }
/* player card: form row + matchup line */
.card .form-row { display: grid; grid-template-columns: auto repeat(4, 1fr); gap: 6px; align-items: stretch; margin-top: 14px; }
.card .form-row .fl { font-size: 12px; font-weight: 600; color: var(--ink-2); display: flex; flex-direction: column; justify-content: center; padding-right: 4px; }
.card .form-row .fl small { font-weight: 500; color: var(--ink-3); font-size: 11px; }
.card .form-row > div { background: var(--rule-2); border-radius: 10px; padding: 7px 4px; text-align: center; display: flex; flex-direction: column; }
.card .form-row b { font: 700 19px/1.1 var(--display); }
.card .form-row small { font-size: 10.5px; color: var(--ink-3); }
.card .mline { display: flex; gap: 10px; align-items: center; margin: 10px 0 0; font-size: 13px; color: var(--ink-2); }
.card .mline b { color: var(--ink); }
.dvchip { font-weight: 700; font-size: 12.5px; border-radius: 999px; padding: 3px 9px; background: var(--rule-2); color: var(--ink-2); white-space: nowrap; }
.dvchip.soft { background: #FCE4D4; color: #9A3F0B; } .dvchip.tough { background: #D6EEF0; color: #0E5E66; }
/* players: form view */
td.trend { font-weight: 700; color: var(--ink-3); }
td.trend.up { color: var(--win); } td.trend.dn { color: var(--out); }
.muted-s { font-size: 12.5px; color: var(--ink-3); }
.loading { padding: 80px 0; color: var(--ink-2); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } html { scroll-behavior: auto; } }

/* ===== 10-22d: masthead record, ticker, game tiles, switcher logos, model-lean board, player rows, team rows, record hero ===== */
.mast { position: relative; overflow: hidden; isolation: isolate; }
.mast .court { position: absolute; right: -140px; top: -170px; width: 640px; height: 640px; stroke: #fff; stroke-width: 4; opacity: .07; z-index: -1; pointer-events: none; }
.mast h1 .dot-y { font-style: normal; color: #FFD24A; }
.mast .mt { flex-wrap: wrap; }
.mrec { display: flex; gap: 22px; margin-left: auto; align-items: flex-end; }
.mrec div { text-align: right; }
.mrec b { display: block; font: 800 28px/1 var(--display); color: #fff; }
.mrec b.g { color: #5AD19A; } .mrec b.r { color: #FF8A80; }
.mrec small { font-size: 10.5px; color: #9AA3AE; text-transform: uppercase; letter-spacing: .07em; white-space: nowrap; }
.mrec:empty { display: none; }
.tabbar button.on { border-bottom-color: #FFD24A; }
.ticker { background: #161B22; color: #D7DCE3; font-size: 13px; overflow: hidden; border-top: 1px solid #222831; white-space: nowrap; }
.tk-track { display: inline-flex; align-items: center; gap: 26px; padding: 8px 0 8px 20px; animation: tk var(--dur, 40s) linear infinite; }
.ticker:hover .tk-track { animation-play-state: paused; }
@keyframes tk { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .ticker { overflow-x: auto; } .tk-track { animation: none; } }
.tk-i { display: inline-flex; align-items: center; gap: 7px; background: none; border: 0; color: inherit; font: inherit; padding: 0; cursor: pointer; }
span.tk-i { cursor: default; } .tk-i + .tk-i { margin-left: 0; }
.tk-i b { font: 700 15px/1 var(--display); letter-spacing: .02em; color: #fff; }
.tk-i .lv { color: #FF6B5E; font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.tk-i .w { color: #5AD19A; font-weight: 800; } .tk-i .l { color: #FF6B5E; font-weight: 800; }
.tk-h { font-size: 11px; font-weight: 700; color: #9AA3AE; text-transform: uppercase; letter-spacing: .08em; margin-right: 12px; }
.tk-h + .tk-i { margin-left: 0; }
.tk-gap { display: inline-block; width: 30px; }
@media (max-width: 760px) { .mrec { gap: 14px; width: 100%; justify-content: flex-start; order: 3; margin: 8px 0 0; } .mrec div { text-align: left; } .mrec b { font-size: 22px; } }
/* game tiles */
.gt { flex: 0 0 196px; padding: 0; gap: 0; overflow: hidden; display: flex; flex-direction: column; }
.gt-bar { display: flex; height: 5px; } .gt-bar i { flex: 1; }
.gt-in { display: grid; gap: 3px; padding: 9px 12px 6px; }
.gt-t b { font: 800 18px/1 var(--display); } .gt-t em { font: 800 18px/1 var(--display); color: var(--ink-3); }
.gt-t.lead em { color: var(--ink); } .gt-t.lost, .gt-t.lost em { color: var(--ink-3); }
.gt-in .gt-st { display: flex; justify-content: space-between; border-top: 1px solid var(--rule-2); padding-top: 6px; margin-top: 3px; }
.gt-in .gt-st.live::before { content: none; } .gt-in .gt-st.live > span:first-child::before { content: "● "; }
.gt-pj { font-weight: 500; text-transform: none; letter-spacing: 0; }
.gt-l { margin: 0 10px 10px; padding: 7px 9px; border: 0; border-radius: 8px; background: #F3F5F8; justify-content: space-between; font-size: 12.5px; }
.gt-l b { overflow: hidden; text-overflow: ellipsis; } .gt-l em { font-style: normal; font-weight: 800; } .gt-l em.pos { color: var(--win); } .gt-l .none { color: var(--ink-3); font-weight: 500; }
/* game switcher logos */
.gswitch .chip { display: inline-flex; align-items: center; gap: 6px; padding-left: 8px; }
.sw-l { display: inline-flex; gap: 2px; } .sw-l .logo, .sw-l .logo-fallback { width: 18px; height: 18px; font-size: 7px; }
/* model leans board */
.leans { background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; }
.lean { display: grid; grid-template-columns: 6px 56px auto minmax(0, 1fr) 84px auto 104px 34px; align-items: center; gap: 0 10px; min-height: 82px; border-bottom: 1px solid var(--rule-2); cursor: pointer; padding-right: 12px; }
.lean:last-child { border-bottom: 0; } .lean:hover { background: #FAFBFC; }
.ln-e { align-self: stretch; background: var(--tc); }
.ln-rk { font: 800 38px/1 var(--display); color: #C3C9D1; text-align: center; } .lean.top .ln-rk { color: var(--ink); }
.ln-lg { display: flex; gap: 4px; } .ln-lg .logo, .ln-lg .logo-fallback { width: 34px; height: 34px; }
.ln-pk { min-width: 0; } .ln-pk small { display: block; font: 700 10.5px/1.2 var(--text); color: var(--ink-3); text-transform: uppercase; letter-spacing: .07em; }
.ln-pk b { display: block; font: 800 27px/1 var(--display); margin: 3px 0 2px; } .ln-pk span { font-size: 12.5px; color: var(--ink-2); }
.ag { position: relative; display: block; width: 84px; height: 54px; }
.ag svg { width: 84px; height: 46px; display: block; } .ag-bg, .ag-f { fill: none; stroke-width: 8; stroke-linecap: round; }
.ag-bg { stroke: #E9ECF0; } .ag-f { stroke: var(--win); } .ag-f.neg { stroke: var(--out); } .ag-t { stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; }
.ag b { position: absolute; left: 0; right: 0; top: 24px; text-align: center; font: 800 17px/1 var(--display); } .ag b.pos { color: var(--win); } .ag b.neg { color: var(--out); }
.ag small { position: absolute; left: 0; right: 0; top: 42px; text-align: center; font-size: 9.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
.ln-pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.lp { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 5px 9px; white-space: nowrap; }
.lp.a { background: var(--algo-soft); color: var(--algo); } .lp.p { background: var(--player-soft); color: var(--player); } .lp.n { background: #F1F3F6; color: var(--ink-2); font-weight: 600; }
.ln-pr { text-align: right; } .ln-pr small { display: block; font-size: 11px; color: var(--ink-3); } .ln-pr b { display: block; font: 800 22px/1.05 var(--display); }
.ln-res { text-align: right; }
#spots .show-all { margin-top: 10px; }
@media (max-width: 860px) {
  .lean { grid-template-columns: 5px 34px auto minmax(0, 1fr) 72px; grid-template-areas: "e rk lg pk ag" "e . pl pl pr"; padding: 10px 10px 10px 0; gap: 6px 8px; }
  .ln-e { grid-area: e; } .ln-rk { grid-area: rk; font-size: 26px; } .ln-lg { grid-area: lg; } .ln-lg .logo, .ln-lg .logo-fallback { width: 26px; height: 26px; }
  .ln-pk { grid-area: pk; } .ln-pk b { font-size: 22px; } .lean .ag { grid-area: ag; transform: scale(.88); transform-origin: right center; }
  .ln-pills { grid-area: pl; justify-content: flex-start; } .ln-pr { grid-area: pr; } .ln-pr b { font-size: 18px; } .ln-res { position: absolute; }
  .lean { position: relative; } .ln-res { right: 10px; top: 8px; }
}
/* player rows */
.plist { background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; }
.prow { display: grid; grid-template-columns: 6px 64px minmax(0, 1fr) 120px auto 170px; align-items: center; gap: 0 12px; width: 100%; min-height: 76px; padding: 0 16px 0 0; border: 0; border-bottom: 1px solid var(--rule-2); background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.prow:last-child { border-bottom: 0; } .prow:hover { background: #FAFBFC; }
.pr-e { align-self: stretch; background: var(--tc); }
.pr-hs { position: relative; width: 52px; height: 52px; border-radius: 50%; overflow: hidden; margin-left: 6px; background: color-mix(in srgb, var(--tc) 18%, #EEF1F4); display: grid; place-items: center; }
.pr-hs img { position: absolute; left: 50%; bottom: -2px; width: 76px; height: 56px; object-fit: cover; object-position: 50% 0; transform: translateX(-50%); }   /* a set height so lazy loading sees it inside the circle */
.pr-hs .ini { font: 800 16px/1 var(--display); color: var(--tc); } .pr-hs:not(.noshot) .ini { display: none; }
.pr-nm b { display: block; font-weight: 700; font-size: 16px; } .pr-nm small { font-size: 12.5px; color: var(--ink-2); }
.pr-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.pr-tags .st, .pr-tags .cf { font-size: 11px; font-weight: 700; border-radius: 5px; padding: 2px 6px; background: #F1F3F6; color: var(--ink-2); }
.cf-key { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 18px; max-width: 980px; margin: 4px 0 16px; font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.cf-key > b { grid-column: 1 / -1; font-size: 13.5px; color: var(--ink); }
.cf-key i.cf { display: inline-block; font-style: normal; font-size: 11px; font-weight: 700; border-radius: 5px; padding: 2px 7px; background: #F1F3F6; color: var(--ink-2); margin-right: 7px; }
.cf-key i.cf.conf-High { background: #E3F3EA; color: var(--win); } .cf-key i.cf.conf-Low { background: #FBF1DF; color: var(--q); }
@media (max-width: 720px) { .cf-key { grid-template-columns: 1fr; } }
.pr-tags .st.q { background: #FFF2D6; color: #8A5A00; } .pr-tags .st.out { background: #FBEAE8; color: var(--out); } .pr-tags .cf.conf-High { background: #E3F3EA; color: var(--win); } .pr-tags .cf.conf-Low { background: #FBF1DF; color: var(--q); }
.pr-min small { display: block; font-size: 10.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; } .pr-min b { font: 800 22px/1 var(--display); }
.pr-mb { display: block; height: 5px; border-radius: 3px; background: #EEF1F4; margin-top: 5px; overflow: hidden; } .pr-mb i { display: block; height: 100%; background: var(--tc); }
.pr-sl { display: flex; gap: 18px; } .pr-sl span { text-align: center; min-width: 40px; } .pr-sl b { display: block; font: 800 26px/1 var(--display); }
.pr-sl small { font-size: 10.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.mu { font-style: normal; font-size: 10px; margin-left: 3px; } .mu.up { color: var(--win); } .mu.dn { color: var(--out); } .mu.eq { color: #C3C9D1; }
.pr-bp { justify-self: end; text-align: right; } .pr-bp small { display: block; font-size: 10px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
.bpc { display: inline-block; border-radius: 999px; padding: 6px 11px; font-size: 12.5px; font-weight: 800; white-space: nowrap; border: 1.5px solid var(--ink); color: var(--ink); }
.bpc.fl { background: var(--ink); color: #fff; } .bpc em { font-style: normal; font-weight: 600; opacity: .7; margin-left: 3px; }
@media (max-width: 860px) {
  .prow { grid-template-columns: 5px 50px minmax(0, 1fr) auto; grid-template-areas: "e hs nm bp" "e hs sl sl"; padding: 10px 10px 10px 0; gap: 6px 10px; }
  .prow .pr-e { grid-area: e; } .prow .pr-hs { grid-area: hs; width: 44px; height: 44px; margin-left: 4px; align-self: start; } .prow .pr-nm { grid-area: nm; } .prow .pr-bp { grid-area: bp; align-self: start; }
  .pr-min { display: none; } .pr-sl { grid-area: sl; gap: 14px; } .pr-sl b { font-size: 21px; }
}
/* team rows */
table.data.tlg tr.trow td.rk { font: 800 22px/1 var(--display); color: var(--ink-3); box-shadow: inset 5px 0 0 var(--tc); padding-left: 12px; width: 40px; }
table.data.tlg tr.trow.tonight .meta { color: var(--player); font-weight: 700; }
table.data.tlg tr.trow td { position: relative; }
table.data.tlg .tbar { position: absolute; right: 8px; bottom: 6px; height: 3px; border-radius: 2px; background: var(--tc); opacity: .4; max-width: calc(100% - 16px); }
/* record hero */
.rhero { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 14px; margin: 12px 0 14px; }
.rh-big { background: #0E1217; color: #fff; border-radius: 16px; padding: 18px 20px; }
